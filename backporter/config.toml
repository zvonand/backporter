# Set by `backporter init <project URL>`.
project_owner = "Altinity"
project_number = 39

# Branch in Altinity/ClickHouse for each version key (<flavor>-X.Y).
# Every version in the project needs an entry; add it here before `backporter add-version`.
[branches]
"stable-25.3" = "releases/25.3.14"
"stable-25.8" = "stable-25.8"
"stable-26.3" = "stable-26.3"
"stable-26.8" = "stable-26.8"
"antalya-25.8" = "antalya-25.8"
"antalya-26.3" = "antalya-26.3"
"antalya-26.6" = "antalya-26.6"
"antalya-26.8" = "antalya-26.8"

# Backport PRs are also added (once) to the team's builds projects, with the version number in the given
# text field. Open PRs get `status`; merged ones are added without a Status; closed ones aren't added.
# The source PR's row there for that version is replaced: its values are copied to the new row (Priority is
# `priority` if it has none), and the version is taken out of it; a row left with no version is deleted.
[builds.stable]
project = 26                         # Stable Builds
version_field = "Port Versions"
status = "Needs Review"
priority = "P0"

[builds.antalya]
project = 17                         # Project Antalya
version_field = "Release Versions (Major)"
status = "Needs Review"
priority = "p0"

[run]
# AI conflict resolution in `backporter run` (`--no-ai` turns it off for one run).
ai = true

# CMake configure command per version key, used by `backporter inspect` to build an AI fix before pushing it.
# It runs in <clone dir>/build-<version key> (so `..` is the source), once, before the first `ninja` there.
# Compilers follow COMPILER_C/COMPILER_CPP in each branch's ci/defs/defs.py.
[cmake]
"stable-25.3" = "cmake -G Ninja -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 .."
"stable-25.8" = "cmake -G Ninja -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 .."
"stable-26.3" = "cmake -G Ninja -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 .."
"stable-26.8" = "cmake -G Ninja -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22 .."
"antalya-25.8" = "cmake -G Ninja -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 .."
"antalya-26.3" = "cmake -G Ninja -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 .."
"antalya-26.6" = "cmake -G Ninja -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 .."
"antalya-26.8" = "cmake -G Ninja -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22 .."

# Labels added to every backport PR the backporter opens. They must already exist in Altinity/ClickHouse.
# Per-version labels follow the team's backport PR convention.
[labels]
all = ["backport"]
stable = ["stable"]
antalya = ["antalya"]
"stable-25.3" = ["25.3", "25.3.14"]
"stable-25.8" = ["25.8", "stable-25.8"]
# The convention adds "stable-26.3", but that label doesn't exist in Altinity/ClickHouse yet.
"stable-26.3" = ["26.3"]
"antalya-25.8" = ["antalya-25.8"]
"antalya-26.3" = ["antalya-26.3"]
"antalya-26.6" = ["antalya-26.6"]
"antalya-26.8" = ["antalya-26.8"]
